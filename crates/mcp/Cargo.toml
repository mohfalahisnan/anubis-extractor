[package]
name = "anubis-extractor-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server exposing anubis-extractor over stdio and HTTP/SSE."

[lib]
name = "anubis_extractor_mcp"
